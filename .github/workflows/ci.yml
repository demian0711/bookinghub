name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Khởi động PostgreSQL cho smoke test
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
          pnpm db:up
      - run: pnpm test
      - run: pnpm build
      - if: always() && hashFiles('.env') != ''
        run: pnpm db:down
