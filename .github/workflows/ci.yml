name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Khởi động PostgreSQL cho smoke test
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
          pnpm db:up
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm --filter @bookinghub/web exec playwright install --with-deps chromium
      - run: pnpm test:web
      - id: e2e
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: bookinghub-e2e
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - run: pnpm build
      - if: always() && hashFiles('.env') != ''
        run: pnpm db:down
